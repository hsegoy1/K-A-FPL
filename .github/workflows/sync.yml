name: Sync FPL data to Firestore

on:
  schedule:
    # Every 15 minutes — needed now that live/provisional scoring is on, so
    # standings actually move as Saturday's matches happen instead of only
    # updating once a day. Cheap to run this often (each run is well under a
    # minute), and GitHub Actions minutes aren't a real constraint at this scale.
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run sync
        env:
          FPL_LEAGUE_ID: ${{ secrets.FPL_LEAGUE_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
