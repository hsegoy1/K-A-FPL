name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId: live
          projectId: office-fpl-league

      # Hosting deploy above only pushes the website files — Firestore
      # security rules need their own deploy step, or edits to
      # firestore.rules would silently never take effect.
      #
      # This uses a dedicated community action (not raw firebase-tools) because
      # firebase-tools itself has a known, currently-open bug where it silently
      # fails to authenticate with GOOGLE_APPLICATION_CREDENTIALS in CI
      # (see firebase/firebase-tools#10726) — this action handles that auth
      # correctly instead.
      - uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules --project office-fpl-league
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
