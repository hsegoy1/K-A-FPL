<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>K&A Paid FPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0D0715; --panel:#170F26; --line:#301F45; --text:#F5EEFF; --muted:#9C8CC2;
  --accent1:#FF2E92; --accent2:#00E5FF; --gold:#FFD23F; --green:#39FF88; --red:#FF4D6D;
  --grad: linear-gradient(120deg, var(--accent1), var(--accent2));
  --font-d:'Sora',sans-serif; --font-b:'Inter',sans-serif; --font-m:'JetBrains Mono',monospace; --radius:16px;
  --club-p:#FF2E92; --club-s:#00E5FF;
}
:root{ --panel-glass: rgba(23,15,38,.55); }
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-b);padding-bottom:76px;-webkit-font-smoothing:antialiased;position:relative;}
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60% 45% at 15% 0%, color-mix(in srgb, var(--club-p) 38%, transparent), transparent 60%),
    radial-gradient(55% 40% at 90% 15%, color-mix(in srgb, var(--club-s) 30%, transparent), transparent 60%),
    radial-gradient(80% 60% at 50% 100%, color-mix(in srgb, var(--club-p) 16%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 26px),
    var(--bg);
  transition: background 1.2s ease;
}
#club-bg-layer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease;pointer-events:none;}
#club-bg-layer.show{opacity:.34;}
#club-bg-layer::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(13,7,21,.4), var(--bg) 92%);}
/* Reduced-motion accessibility: keep it fast/instant rather than disabling
   animations outright — several elements (standings rows, insight cards,
   the intro badge) start hidden and rely on their animation's "forwards"
   fill-mode to actually reach their visible end state. A blanket
   animation:none leaves those stuck invisible forever instead of just
   skipping the motion, which is a real bug, not just a preference. */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important;}
}

/* ---------- Glass utility ---------- */
.glass{background:rgba(23,15,38,.5);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.09);box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 8px 24px rgba(0,0,0,.35);}

.hero{padding:20px 18px 16px;position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% -20%, rgba(255,46,146,.28), transparent 55%),radial-gradient(120% 140% at -20% -10%, rgba(0,229,255,.22), transparent 50%);}
.hero-inner{max-width:1120px;margin:0 auto;}
.live{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-m);font-size:11px;letter-spacing:.08em;color:var(--accent2);margin-bottom:8px;}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:pulse 1.8s infinite;}
.live.is-live{color:var(--red);}
.live.is-live .dot{background:var(--red);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,229,255,.6);}70%{box-shadow:0 0 0 8px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.hero h1{font-family:var(--font-d);font-size:26px;font-weight:800;margin:0 0 2px;letter-spacing:-.01em;}
.hero p{margin:0;color:var(--muted);font-size:13px;}
.hero-stats{display:flex;gap:10px;margin-top:14px;overflow-x:auto;}
.hstat{flex:0 0 auto;background:var(--panel-glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-width:96px;}
.hstat b{display:block;font-family:var(--font-m);font-size:20px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hstat span{font-size:10px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}

.mode-select{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 0;max-width:1120px;margin:0 auto;}
.mode-pill{flex:0 0 auto;font-family:var(--font-m);font-size:12px;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel-glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);color:var(--muted);cursor:pointer;}
.mode-pill.on{background:var(--grad);color:#0D0715;font-weight:700;border-color:transparent;}
.mode-label{font-size:10.5px;color:var(--muted);padding:8px 16px 0;text-transform:uppercase;letter-spacing:.05em;max-width:1120px;margin:0 auto;}

main{padding:16px;max-width:1120px;margin:0 auto;}
.view{display:none;}
.view.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Landing highlights strip (Table view) ---------- */
.highlights-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.hi-card{background:var(--panel-glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);padding:12px 13px;position:relative;overflow:hidden;cursor:pointer;}
.hi-card::before{content:'';position:absolute;top:-40%;right:-30%;width:70%;height:70%;background:var(--grad);opacity:.12;border-radius:50%;filter:blur(18px);}
.hi-card .hi-label{font-family:var(--font-m);font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.hi-card .hi-title{font-family:var(--font-d);font-size:14px;font-weight:700;margin:4px 0 2px;}
.hi-card .hi-sub{font-size:11px;color:var(--muted);}
.hi-card .hi-bar-bg{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;}
.hi-card .hi-bar-fill{height:100%;background:var(--grad);width:0%;transition:width 1s cubic-bezier(.22,1,.36,1);}

/* ---------- Desktop: reclaim the extra width ---------- */
@media (min-width: 860px){
  body{padding-bottom:0;}
  main{padding:20px 24px 60px;}
  .tabbar{position:static;background:none;border:none;backdrop-filter:none;justify-content:center;gap:28px;padding:14px 6px 6px;max-width:1120px;margin:0 auto;}
  .tab{flex:0 0 auto;flex-direction:row;gap:7px;font-size:13px;padding:8px 4px;}
  .tab .ic{font-size:16px;}
  .awards-grid{grid-template-columns:repeat(auto-fit, minmax(230px,1fr));}
  .highlights-grid{grid-template-columns:repeat(4, 1fr);}

  /* Pitch view: on a real monitor, the mobile-tuned sizing (built for a
     phone held close to the eyes) reads as genuinely too small — this isn't
     a nudge, it's a proper second scale for the format people actually view
     this at on desktop. */
  .pv-topbar-inner{max-width:760px;}
  .pv-body-inner{max-width:760px;}
  .pv-header-info .av{width:44px;height:44px;font-size:15px;}
  .pv-header-info .nm{font-size:17px;}
  .pv-header-info .sc{font-size:14px;}
  .pv-jersey svg{width:66px;height:72px;}
  .pv-jersey .pn{font-size:14.5px;max-width:110px;}
  .pv-jersey .pp{font-size:19px;}
  .pv-split .pv-jersey svg{width:46px;height:50px;}
  .pv-split .pv-jersey .pn{font-size:11.5px;max-width:72px;}
  .pv-split .pv-jersey .pp{font-size:14.5px;}
  .stand-title{font-size:12px;}
  .player-popup{width:340px;}
  .pp-name{font-size:19px;}
  .pp-fixture{font-size:13px;}
  .pp-table td{font-size:13px;}
}
/* Insights: two-column layout on anything wide enough to fit it comfortably —
   uses CSS multi-column (not grid) specifically because each section-title +
   card is wrapped as one .insight-block unit, and multi-column is what
   correctly keeps a whole block together in one column via break-inside,
   rather than letting a title and its card land in different columns. */
@media (min-width: 700px){
  #view-insights.active, #view-drama.active{column-count:2;column-gap:20px;}
  #view-insights .insight-block, #view-drama .insight-block{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;vertical-align:top;}
}

.section-title{font-family:var(--font-d);font-size:16px;font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:8px;}
.new-badge{font-family:var(--font-m);font-size:9px;font-weight:800;background:var(--grad);color:#0D0715;padding:2px 7px;border-radius:8px;letter-spacing:.04em;cursor:pointer;animation:newPulse 1.6s ease-in-out infinite;}
@keyframes newPulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.admin-note-live{background:rgba(255,210,63,.1);border:1px solid rgba(255,210,63,.3);border-radius:10px;padding:9px 11px;font-size:11px;color:var(--gold);margin-top:10px;line-height:1.5;}
.autopsy-card{margin-bottom:14px;}
.autopsy-text{margin-top:10px;font-size:12.5px;line-height:1.65;color:var(--text);}
.autopsy-text p{margin:0 0 10px;}
.autopsy-text p:last-child{margin-bottom:0;}
.shame-card{margin-bottom:14px;}
.insight-filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.if-pill{background:var(--panel-glass);border:1px solid var(--line);border-radius:20px;padding:5px 14px;font-family:var(--font-m);font-size:11px;cursor:pointer;color:var(--muted);transition:all .15s;}
.if-pill.active{background:var(--grad);color:#0D0715;border-color:transparent;font-weight:700;}
.totw-wrap{margin-bottom:14px;}
.totw-section{background:var(--panel-glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:6px;}
.totw-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;}
.totw-header h3{font-family:var(--font-d);font-size:13.5px;margin:0;}
.totw-chevron{color:var(--muted);font-size:12px;transition:transform .2s;}
.totw-section.open .totw-chevron{transform:rotate(180deg);}
.totw-body{display:none;padding:0 10px 10px;}
.totw-section.open .totw-body{display:block;}
.totw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-top:6px;}
.totw-player{text-align:center;background:rgba(255,255,255,.03);border-radius:8px;padding:5px 3px;}
.totw-player .tpos{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.totw-player .tname{font-size:10px;font-weight:700;margin:2px 0;}
.totw-player .tpts{font-family:var(--font-m);font-size:11px;color:var(--accent2);font-weight:700;}
.shame-spotlight{font-size:12.5px;line-height:1.5;background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.25);border-radius:10px;padding:10px 12px;margin:10px 0;}
.shame-ticker{display:flex;flex-direction:column;gap:2px;}
.shame-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:11.5px;border-bottom:1px solid var(--line);}
.shame-row:last-child{border-bottom:none;}
.shame-row .n{width:16px;color:var(--muted);font-family:var(--font-m);flex-shrink:0;}
.shame-row .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shame-row .v{font-family:var(--font-m);color:var(--red);font-weight:700;flex-shrink:0;}
.fx-weather{font-size:10px;}
.bingo-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:10px;}
.bingo-cell{background:var(--panel-glass);border:1px solid var(--line);border-radius:8px;padding:6px 3px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:8.5px;color:var(--muted);line-height:1.3;transition:background .15s;}
.bingo-cell.hit{background:rgba(57,255,136,.12);border-color:rgba(57,255,136,.4);color:var(--green);}
.bingo-cell.bingo-line{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.4);color:var(--accent2);}
.bingo-cell.free{background:rgba(255,46,146,.12);border-color:rgba(255,46,146,.4);color:var(--accent1);font-weight:700;}
.bingo-cell-icon{font-size:14px;margin-bottom:2px;}
.bingo-banner{background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);border-radius:10px;padding:8px 12px;text-align:center;margin-top:10px;font-family:var(--font-m);font-size:12px;color:var(--accent2);font-weight:700;}
.dna-archetype{font-size:22px;font-weight:700;font-family:var(--font-d);margin-bottom:6px;}
.dna-traits{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
.dna-trait-row{display:flex;align-items:center;gap:8px;font-size:11px;}
.dna-trait-row .tname{width:80px;color:var(--muted);flex-shrink:0;}
.dna-bar-bg{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;}
.dna-bar-fill{height:100%;background:var(--grad);border-radius:3px;}
.dna-trait-row .tscore{width:28px;text-align:right;font-family:var(--font-m);color:var(--accent2);font-size:10px;flex-shrink:0;}
.derby-vs{display:flex;align-items:center;gap:12px;margin-top:10px;}
.derby-side{flex:1;text-align:center;}
.derby-side .dname{font-weight:700;font-size:13px;}
.derby-side .dscore{font-family:var(--font-m);font-size:22px;color:var(--accent2);}
.derby-mid{color:var(--muted);font-size:11px;font-family:var(--font-m);}
.derby-stat{font-size:11px;color:var(--muted);text-align:center;margin-top:6px;}
.fpliq-score{font-size:38px;font-weight:800;font-family:var(--font-d);text-align:center;margin:8px 0 2px;}
.fpliq-label{text-align:center;font-size:13px;color:var(--accent2);font-family:var(--font-m);margin-bottom:10px;}
.fpliq-bars{display:flex;flex-direction:column;gap:5px;}
.fpliq-bar-row{display:flex;align-items:center;gap:8px;font-size:10.5px;}
.fpliq-bar-row .fname{width:90px;color:var(--muted);flex-shrink:0;}
.fpliq-bar-bg{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden;}
.fpliq-bar-fill{height:100%;background:var(--grad);border-radius:3px;}
.fpliq-bar-row .fscore{width:24px;text-align:right;font-family:var(--font-m);font-size:10px;color:var(--muted);flex-shrink:0;}
.gotaway-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;}
.gotaway-row:last-child{border-bottom:none;}
.gotaway-row .gname{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.gotaway-row .gsold{color:var(--muted);font-size:10px;flex-shrink:0;}
.gotaway-row .gpts{font-family:var(--font-m);color:var(--red);font-weight:700;flex-shrink:0;}
.court-defendant{background:rgba(255,77,109,.07);border:1px solid rgba(255,77,109,.25);border-radius:10px;padding:10px 12px;margin-bottom:12px;}
.court-defendant .cname{font-weight:700;font-size:13px;}
.court-defendant .ccrime{font-size:11px;color:var(--muted);margin-top:2px;}
.court-section{margin-bottom:10px;}
.court-section .ctitle{font-family:var(--font-m);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
.court-section .ctext{font-size:12px;line-height:1.55;}
.court-vote{display:flex;gap:8px;margin-top:12px;}
.court-vote button{flex:1;padding:8px;border-radius:10px;font-family:var(--font-m);font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--line);}
.court-vote .guilty{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.4);color:var(--red);}
.court-vote .innocent{background:rgba(57,255,136,.1);border-color:rgba(57,255,136,.4);color:var(--green);}
.court-result{text-align:center;font-family:var(--font-m);font-size:13px;font-weight:700;margin-top:10px;}
.diffdanger-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12px;}
.diffdanger-row:last-child{border-bottom:none;}
.diffdanger-row .dplayer{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.diffdanger-row .dteam{font-size:10px;color:var(--muted);}
.diffdanger-row .downs{font-family:var(--font-m);font-size:10px;color:var(--muted);flex-shrink:0;}
.diffdanger-row .dlastpts{font-family:var(--font-m);font-weight:700;color:var(--accent2);flex-shrink:0;}
.pressconf-seg{margin-bottom:14px;}
.pressconf-seg:last-child{margin-bottom:0;}
.pressconf-who{font-family:var(--font-m);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;}
.pressconf-q{font-size:11.5px;color:var(--muted);font-style:italic;margin-bottom:4px;}
.pressconf-a{font-size:12.5px;line-height:1.55;}
.lostpts-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;}
.lostpts-row .n{width:16px;color:var(--muted);font-family:var(--font-m);flex-shrink:0;}
.lostpts-row .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lostpts-row .v{font-family:var(--font-m);color:var(--red);font-weight:700;flex-shrink:0;}
.lab-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;}
.lab-row:last-child{border-bottom:none;}
.lab-row .lgw{font-family:var(--font-m);font-size:9px;color:var(--muted);flex-shrink:0;width:28px;}
.lab-move{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lab-move .lin{color:var(--green);font-weight:600;}
.lab-move .lout{color:var(--red);}
.lab-verdict{font-family:var(--font-m);font-size:10px;font-weight:700;flex-shrink:0;}
.lab-verdict.genius{color:var(--green);}
.lab-verdict.disaster{color:var(--red);}
.lab-verdict.neutral{color:var(--muted);}
.copied-group{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;}
.copied-group:last-child{margin-bottom:0;}
.copied-player{font-weight:700;font-size:12.5px;margin-bottom:4px;}
.copied-managers{font-size:11px;color:var(--muted);}
.section-title .bar{width:3px;height:14px;background:var(--grad);border-radius:2px;}

.row{display:flex;align-items:center;gap:12px;background:var(--panel-glass);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;cursor:pointer;opacity:0;transform:translateY(8px);animation:rowIn .4s ease forwards;}

/* ---------- Table split view (fixtures appear alongside standings in per-GW mode) ---------- */
.table-split{display:flex;gap:10px;align-items:flex-start;}
.table-col-standings{flex:1;min-width:0;}
.table-col-fixtures{width:42%;flex-shrink:0;background:var(--panel-glass);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;position:sticky;top:12px;align-self:flex-start;max-height:calc(100vh - 24px);display:flex;flex-direction:column;}
.table-col-fixtures.hidden{display:none;}
.fixtures-scroll{overflow-y:auto;}
.fixtures-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 6px;flex-shrink:0;}
.fixtures-nav .col-title{padding:0;}
.fixtures-nav-btns{display:flex;align-items:center;gap:6px;}
.fx-nav-btn{width:24px;height:24px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fx-nav-btn:disabled{opacity:.3;cursor:default;}
.table-col-standings.compact .row{padding:8px 9px;gap:7px;border-radius:10px;margin-bottom:5px;}
.table-col-standings.compact .avatar{width:26px;height:26px;border-radius:7px;font-size:11px;}
.table-col-standings.compact .rinfo .team{font-size:12.5px;}
.table-col-standings.compact .rinfo .mgr{font-size:9.5px;}
.table-col-standings.compact .rpts b{font-size:13.5px;}
.table-col-standings.compact .rpts span{font-size:10px;}
.ghost-row{display:flex;align-items:center;gap:7px;background:rgba(155,92,255,.08);border:1px dashed rgba(155,92,255,.4);border-radius:10px;padding:8px 9px;margin-bottom:5px;opacity:0;transform:translateY(8px);animation:rowIn .4s ease forwards;}
.ghost-row .pos{font-family:var(--font-m);color:var(
